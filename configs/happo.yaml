training:
  environment_profile: main
  seed: 1
  device: cpu
  num_envs: 16
  rollout_steps: 128
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  minibatch_size: 256
  clip_coef: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.001
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  hidden_dim: 128
  recurrent_hidden_dim: 128
  recurrent_sequence_length: 16
  actor_variant: vanilla
  critic_variant: mlp
  method_variant: baseline
  agp_lambda: 0.5
  curriculum_schedule:
    - [0.00, 0.00]
    - [0.25, 0.25]
    - [0.50, 0.75]
    - [0.75, 1.00]
  curriculum_total_steps: null
  hrta_entity_dim: 32
  hrta_role_dim: 16
  hrta_fusion_hidden_dim: 64
