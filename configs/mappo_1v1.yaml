experiment:
  seed: 42
  device: auto
  output_dir: outputs/mappo
network:
  hidden_dim: 128
  log_std_init: -0.5
training:
  training_mode: paper_staged
  total_env_steps: 2000000
  num_envs: 32
  rollout_steps: 256
  curriculum_tail_chase_env_steps: 100000
  fixed_tail_chase_env_steps: 500000
  fixed_training_env_steps: 2000000
  fixed_opponent_gate_win_rate: 0.70
  alternating_block_env_steps: 100000
  competitive_training_env_steps: 1000000
  ppo_epochs: 5
  minibatch_size: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  learning_rate: 0.0003
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  eval_interval_updates: 5
  checkpoint_interval_updates: 10
evaluation:
  episodes: 30
  deterministic: true
