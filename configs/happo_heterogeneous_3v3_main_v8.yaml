experiment:
  seed: 42
  device: auto
  output_dir: outputs/happo_heterogeneous_3v3_main_v8

network:
  hidden_dim: 128
  log_std_init: -1.0
  log_std_min: -3.0
  log_std_max: -0.3

training:
  training_mode: fixed_rule_blue_3v3_happo
  total_env_steps: 1000000
  num_envs: 16
  num_env_workers: 4
  rollout_steps: 256
  team_size: 3
  observation_dims: [68, 68, 68]
  action_dims: [3, 3, 3]
  ppo_epochs: 5
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  actor_learning_rate: 0.0003
  actor_learning_rate_final: 0.00003
  critic_learning_rate: 0.0003
  critic_learning_rate_final: 0.00003
  entropy_coef: 0.003
  entropy_coef_final: 0.0001
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  evaluation_interval_env_steps: 100000
  quick_evaluation_episodes: 60
  checkpoint_interval_env_steps: 100000

evaluation:
  episodes: 60
  deterministic: true
