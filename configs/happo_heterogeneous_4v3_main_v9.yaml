experiment:
  seed: 42
  device: auto
  output_dir: outputs/happo_heterogeneous_4v3_main_v9

network:
  hidden_dim: 128
  log_std_init: -0.5
  log_std_min: -2.0
  log_std_max: 0.0

training:
  training_mode: fixed_rule_blue_heterogeneous_4v3_happo
  total_env_steps: 1000000
  num_envs: 8
  num_env_workers: 4
  rollout_steps: 256
  team_size: 4
  observation_dims: [118, 118, 118, 118]
  action_dims: [3, 3, 3, 3]

  ppo_epochs: 5
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2

  actor_learning_rate: 0.0003
  actor_learning_rate_final: 0.00003
  critic_learning_rate: 0.0003
  critic_learning_rate_final: 0.00003

  entropy_coef: 0.01
  entropy_coef_final: 0.001

  value_loss_coef: 0.5
  max_grad_norm: 0.5
  evaluation_interval_env_steps: 100000
  quick_evaluation_episodes: 60
  checkpoint_interval_env_steps: 100000

evaluation:
  episodes: 60
  deterministic: true

notes:
  source_algorithm: "HAPPO update is unchanged; this config only changes the red team size and v9 environment contract."
  environment_alignment: "Functional heterogeneity is encoded by role, sensor range, attack permission, information sharing, and reward terms while all aircraft share one physical spec."
