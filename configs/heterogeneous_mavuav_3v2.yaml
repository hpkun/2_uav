environment_version: heterogeneous_mavuav_3v2_v2
simulation:
  decision_dt: 1.0       # s
  physics_dt: 0.1        # s
  max_decision_steps: 75
battlefield:
  x: [-100000.0, 100000.0]  # m
  y: [-100000.0, 100000.0]  # m
  altitude: [1000.0, 20000.0]  # m
aircraft_specs:
  MAV: {v_min: 250.0, v_max: 400.0, nx: [-1.0, 5.0], ny: [-1.5, 2.0], nz: [-3.0, 3.0]}
  UAV: {v_min: 150.0, v_max: 300.0, nx: [-1.0, 5.0], ny: [-1.5, 1.5], nz: [-2.0, 2.0]}
  Blue: {v_min: 250.0, v_max: 400.0, nx: [-1.0, 5.0], ny: [-1.5, 3.0], nz: [-3.0, 3.0]}
scenario:
  default_profile: main
  initial:
    MAV: {position: [-4500.0, 0.0, 5000.0], speed: 325.0, heading_deg: 0.0}
    UAV1: {position: [-4000.0, -800.0, 5000.0], speed: 225.0, heading_deg: 0.0}
    UAV2: {position: [-4000.0, 800.0, 5000.0], speed: 225.0, heading_deg: 0.0}
    Blue1: {position: [4000.0, -600.0, 5000.0], speed: 325.0, heading_deg: 180.0}
    Blue2: {position: [4000.0, 600.0, 5000.0], speed: 325.0, heading_deg: 180.0}
randomization_profiles:
  learnability:
    team_xy_jitter: 0.0
    slot_xy_jitter: 200.0
    altitude_jitter: 100.0
    speed_jitter: 10.0
    heading_jitter_deg: 3.0
  main:
    team_xy_jitter: 1500.0
    slot_xy_jitter: 300.0
    altitude_jitter: 400.0
    speed_jitter: 20.0
    heading_jitter_deg: 10.0
sensing:
  MAV_range: 12000.0
  UAV_range: 8000.0
normalization:
  self_xy_scale: 30000.0
  relative_xy_scale: 12000.0
  relative_altitude_scale: 10000.0
  distance_scale: 12000.0
  relative_velocity_scale: 800.0
safety:
  red_safe_distance: 100.0
  red_safe_distance_penalty: -1.0
combat:
  distance: [1000.0, 3000.0]  # m
  ata_deg: 30.0
  aa_deg: 90.0
  hold_steps: 3
reward:
  blue_kill: 50.0
  uav_loss: -10.0
  mav_loss: -100.0
  terminal_red_win: 100.0
  terminal_blue_win: -100.0
  terminal_draw: 0.0
blue_policy:
  target_mode: mixed_episode
