experiment:
  seed: 42
  device: auto
  output_dir: outputs/madsac_3v3_v4

network:
  actor_hidden_dim: 256
  critic_hidden_dim: 256
  attention_heads: 2
  log_std_min: -5.0
  log_std_max: 2.0
  log_std_bias_init: -0.5

training:
  training_mode: fixed_rule_blue_3v3_madsac
  total_env_steps: 1000000
  num_envs: 16
  num_env_workers: 4

  replay_capacity: 1000000
  batch_size: 1024
  learning_starts: 20000
  gradient_steps: 1

  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0001

  gamma: 0.99
  tau: 0.001
  alpha: 0.1
  policy_delay: 2

  max_actor_grad_norm: 10.0
  max_critic_grad_norm: 10.0

  evaluation_interval_env_steps: 100000
  quick_evaluation_episodes: 60
  checkpoint_interval_env_steps: 100000
  log_interval_env_steps: 2048

evaluation:
  episodes: 60
  deterministic: true

notes:
  policy_delay: "Reproduction assumption when not explicitly specified by the paper."
  state_dependent_log_std: "Standard continuous SAC implementation assumption."
  alpha: "First version uses fixed alpha=0.1 without automatic temperature tuning."
  reward: "Current project paper_coupled_team_v2 reward is kept; original segmented paper reward is not added."
