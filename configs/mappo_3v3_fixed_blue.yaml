experiment:
  seed: 42
  device: auto
  output_dir: outputs/mappo_3v3_fixed_blue
network:
  hidden_dim: 128
  log_std_init: -0.5
training:
  training_mode: fixed_rule_blue_3v3
  total_env_steps: 500000
  num_envs: 8
  num_env_workers: 4
  rollout_steps: 256
  ppo_epochs: 5
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  learning_rate: 0.0003
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  evaluation_interval_env_steps: 100000
  quick_evaluation_episodes: 60
evaluation:
  episodes: 60
  deterministic: true
