experiment:
  seed: 42
  device: auto
  output_dir: outputs/happo_heterogeneous_3v3_fixed_blue

network:
  hidden_dim: 128
  log_std_init: -0.5
  log_std_min: -2.0
  log_std_max: 0.0

training:
  training_mode: fixed_rule_blue_3v3_happo
  total_env_steps: 500000
  num_envs: 8
  num_env_workers: 4
  rollout_steps: 256
  team_size: 3
  observation_dims: [68, 68, 68]
  action_dims: [3, 3, 3]

  ppo_epochs: 5
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2

  actor_learning_rate: 0.0003
  actor_learning_rate_final: 0.00003
  critic_learning_rate: 0.0003
  critic_learning_rate_final: 0.00003

  entropy_coef: 0.01
  entropy_coef_final: 0.001

  value_loss_coef: 0.5
  max_grad_norm: 0.5
  evaluation_interval_env_steps: 100000
  quick_evaluation_episodes: 60
  checkpoint_interval_env_steps: 100000

evaluation:
  episodes: 60
  deterministic: true

notes:
  source_algorithm: "HAPPO from Trust Region Policy Optimisation in Multi-Agent Reinforcement Learning."
  project_alignment: "Same HAPPO hyperparameters as the existing 3v3 fixed-blue baseline; only the environment is functional heterogeneous v1."
  role_mapping: "actor 0 -> red_0 support, actor 1 -> red_1 combat, actor 2 -> red_2 combat."
