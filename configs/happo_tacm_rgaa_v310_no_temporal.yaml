training:
  environment_profile: main
  seed: 1
  device: cuda
  num_envs: 16
  rollout_steps: 128
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  minibatch_size: 256
  clip_coef: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.001
  entropy_coef: 0.001
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  hidden_dim: 128
  actor_log_std_init: -0.25
  actor_variant: vanilla
  critic_variant: mlp
  method_variant: tacm_rgaa
  role_advantage_coef: 0.5
  role_aux_reward_mode: process_plus_own_loss
  role_module_enabled: true
  dbm_role_count: 2
  dbm_residual_scale: 0.25
  dbm_init_scale: 0.01
  dbm_initialization_semantics: zero_router_antisymmetric_experts_v1
  tacm_tau_group: 0.25
  tacm_tau_teacher: 0.25
  tacm_context_coef_start: 0.05
  tacm_context_coef_end: 0.01
  tacm_context_anneal_steps: 500000
  tacm_temporal_coef: 0.0
  randomization_curriculum_enabled: true
  curriculum_start_profile: learnability
  curriculum_end_profile: main
  curriculum_steps: 400000
  final_evaluation_role: execution_smoke
