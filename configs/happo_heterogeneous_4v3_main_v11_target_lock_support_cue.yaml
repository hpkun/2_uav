experiment:
  seed: 42
  device: auto
  output_dir: outputs/happo_heterogeneous_4v3_main_v11_target_lock_support_cue
  variant: functional_heterogeneous_4v3_v11_target_lock_support_cue

network:
  hidden_dim: 128
  log_std_init: -1.0
  log_std_min: -3.0
  log_std_max: -0.3

training:
  training_mode: fixed_rule_blue_heterogeneous_4v3_happo
  total_env_steps: 3000000
  num_envs: 8
  num_env_workers: 4
  rollout_steps: 256
  team_size: 4
  observation_dims: [118, 118, 118, 118]
  action_dims: [3, 3, 3, 3]
  ppo_epochs: 5
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  actor_learning_rate: 0.0003
  actor_learning_rate_final: 0.0001
  critic_learning_rate: 0.0003
  critic_learning_rate_final: 0.00005
  entropy_coef: 0.003
  entropy_coef_final: 0.0005
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  evaluation_interval_env_steps: 100000
  quick_evaluation_episodes: 60
  checkpoint_interval_env_steps: 100000

evaluation:
  deterministic: true
  selection_episodes: 60
  test_episodes: 200
  selection_seed_offset: 50000
  test_seed_offset: 150000

notes:
  source_algorithm: "HAPPO sequential update, PPO, GAE and network settings are inherited from v10."
  environment: "v11 target lock and support cue mechanism; no formal training is run in the reachability audit."
